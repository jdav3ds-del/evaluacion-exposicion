<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación de mi exposición</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f6fb;
        color: #1f2937;
    }
    .contenedor {
        max-width: 850px;
        margin: 0 auto;
        padding: 24px 16px 40px;
    }
    .encabezado {
        background: white;
        border-radius: 18px;
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 4px 16px rgba(0,0,0,.08);
        margin-bottom: 20px;
    }
    h1 {
        margin: 0 0 10px;
        font-size: 30px;
    }
    .subtitulo {
        margin: 0;
        color: #64748b;
        line-height: 1.5;
    }
    .criterio {
        background: white;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 15px;
        box-shadow: 0 3px 12px rgba(0,0,0,.07);
        border-left: 5px solid #2563eb;
    }
    .numero {
        font-weight: bold;
        color: #2563eb;
        margin-bottom: 8px;
    }
    .texto {
        line-height: 1.55;
        margin-bottom: 16px;
    }
    .botones {
        display: flex;
        gap: 10px;
    }
    button {
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        flex: 1;
    }
    .si {
        background: #dcfce7;
        color: #166534;
    }
    .no {
        background: #fee2e2;
        color: #991b1b;
    }
    button.seleccionado {
        outline: 3px solid #1f2937;
        transform: scale(1.02);
    }
    .resultado {
        background: white;
        border-radius: 18px;
        padding: 24px;
        text-align: center;
        margin-top: 20px;
        box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .barra {
        height: 14px;
        background: #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
        margin: 15px 0;
    }
    .progreso {
        height: 100%;
        width: 0%;
        background: #2563eb;
        transition: width .3s;
    }
    #mensaje {
        font-size: 18px;
        font-weight: bold;
        margin: 12px 0;
    }
    .reiniciar {
        background: #2563eb;
        color: white;
        margin-top: 8px;
        max-width: 220px;
    }
    footer {
        text-align: center;
        color: #64748b;
        margin-top: 25px;
        font-size: 14px;
    }
    @media (max-width: 600px) {
        h1 { font-size: 24px; }
        .contenedor { padding: 14px 10px 30px; }
        .criterio { padding: 16px; }
        button { padding: 11px 10px; }
    }
</style>
</head>
<body>

<div class="contenedor">
    <section class="encabezado">
        <h1>📋 Evaluación de mi exposición</h1>
        <p class="subtitulo">
            Marca <strong>Sí</strong> o <strong>No</strong> según observes cada criterio
            durante la presentación.
        </p>
    </section>

    <div id="criterios"></div>

    <section class="resultado">
        <h2>📊 Resultado</h2>
        <p id="contador">Criterios evaluados: 0 de 4</p>
        <div class="barra"><div class="progreso" id="progreso"></div></div>
        <p id="mensaje">Selecciona Sí o No en cada criterio.</p>
        <button class="reiniciar" onclick="reiniciar()">🔄 Reiniciar evaluación</button>
    </section>

    <footer>
        Proyecto escolar · Propuesta para contribuir a combatir la corrupción en el Perú
    </footer>
</div>

<script>
const criterios = [
    "Explica una propuesta de solución para contribuir con las instituciones públicas o privadas que apoyan a los grupos vulnerados a combatir la corrupción en el Perú.",
    "Desarrolla sus ideas de manera clara a partir de sus saberes previos y fuentes diversas, evitando vacíos de información y contradicciones.",
    "Vocaliza y varía su entonación según el contenido y propósito durante toda su presentación oral.",
    "Acompaña su lenguaje verbal con movimientos corporales y gestuales acordes al mensaje que transmite."
];

const respuestas = [null, null, null, null];
const contenedor = document.getElementById("criterios");

criterios.forEach((criterio, i) => {
    const tarjeta = document.createElement("section");
    tarjeta.className = "criterio";
    tarjeta.innerHTML = `
        <div class="numero">Criterio ${i + 1}</div>
        <div class="texto">${criterio}</div>
        <div class="botones">
            <button class="si" onclick="responder(${i}, true, this)">✓ Sí</button>
            <button class="no" onclick="responder(${i}, false, this)">✕ No</button>
        </div>
    `;
    contenedor.appendChild(tarjeta);
});

function responder(indice, valor, boton) {
    respuestas[indice] = valor;

    const botones = boton.parentElement.querySelectorAll("button");
    botones.forEach(b => b.classList.remove("seleccionado"));
    boton.classList.add("seleccionado");

    actualizarResultado();
}

function actualizarResultado() {
    const evaluados = respuestas.filter(r => r !== null).length;
    const cumplidos = respuestas.filter(r => r === true).length;

    document.getElementById("contador").textContent =
        `Criterios evaluados: ${evaluados} de 4`;

    document.getElementById("progreso").style.width =
        `${(evaluados / 4) * 100}%`;

    const mensaje = document.getElementById("mensaje");

    if (evaluados < 4) {
        mensaje.textContent = "Selecciona Sí o No en los criterios que faltan.";
    } else if (cumplidos === 4) {
        mensaje.textContent = "🎉 ¡La exposición cumple con los 4 criterios!";
    } else {
        mensaje.textContent =
            `Se cumplen ${cumplidos} de 4 criterios. Revisa los criterios marcados como “No”.`;
    }
}

function reiniciar() {
    respuestas.fill(null);
    document.querySelectorAll("button").forEach(b => b.classList.remove("seleccionado"));
    document.getElementById("contador").textContent = "Criterios evaluados: 0 de 4";
    document.getElementById("progreso").style.width = "0%";
    document.getElementById("mensaje").textContent =
        "Selecciona Sí o No en cada criterio.";
}
</script>

</body>
</html>
